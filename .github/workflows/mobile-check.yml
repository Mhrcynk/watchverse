name: Mobil doğrulama
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:sync
      - run: node scripts/test-database.mjs
      - run: node --test scripts/test-worker.mjs
      - run: npm run test:audit
      - run: npx expo export --platform ios --platform android --output-dir dist-native
      - run: npm run lint
