# Mobil uygulamanın kataloğunu ve API servislerini günceller. Web yayını yok.
# Elle çalıştırmak için: GitHub → Actions → "Katalogu güncelle" → Run workflow
name: Katalogu güncelle

on:
  schedule:
    - cron: '17 4 * * *'   # her gün 07:17 (Türkiye saati): yeni çıkan yapım aynı gün eklenir
  workflow_dispatch:
    inputs:
      days:
        description: 'Kaç gün geriye bakılsın (geçmişte kaçanları toplamak için büyüt)'
        required: false
        default: '180'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mobile-backend
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run test:sync
      - run: node scripts/test-database.mjs
      - run: node --test scripts/test-worker.mjs

      - name: Yeni bölüm, sezon ve yapımları bul
        if: github.event_name != 'push'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/update-catalog.mjs --days=${{ github.event.inputs.days || '180' }} --max=60

      - name: Eksik afiş ve Türkçe özetleri tamamla
        if: github.event_name != 'push'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/resolve-tmdb.mjs || true

      - name: Türkiye'deki platform bilgisini güncelle
        if: github.event_name != 'push'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/providers.mjs || true

      - name: Katalogu kaydet
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet src/data/catalog.json; then
            git config user.name "watchverse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/catalog.json
            git commit -m "Katalog güncellendi ($(date +%F))"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            # GitHub, 60 gün hareketsiz kalan depolarda zamanlanmış görevi durdurur; bunu önlemek için
            git config user.name "watchverse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Haftalık kontrol: değişiklik yok"
            git push
          fi

      - name: Üyelik ve veritabanını kur ya da güncelle
        id: supa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node scripts/setup-supabase.mjs

      - name: Ara sunucuyu kur ya da güncelle
        id: worker
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/deploy-worker.mjs

      - name: Platform listelerini güncelle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/lists.mjs || true

      - name: Koleksiyonları güncelle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/collections.mjs || true
