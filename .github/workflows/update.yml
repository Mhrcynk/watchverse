# Haftada bir (pazartesi sabahı) yeni bölüm, sezon ve yapımları ekler, siteyi yeniden yayınlar.
# Elle çalıştırmak için: GitHub → Actions → "Katalogu güncelle" → Run workflow
name: Katalogu güncelle

on:
  schedule:
    - cron: '17 4 * * 1'   # her pazartesi 07:17 (Türkiye saati)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Site adresini belirle
        id: site
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
        run: |
          D=$(echo "$CUSTOM_DOMAIN" | sed -E 's#^https?://##; s#/.*$##' | tr -d '[:space:]')
          OLD="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          if [ -n "$D" ]; then
            echo "url=https://$D/" >> "$GITHUB_OUTPUT"; echo "base=" >> "$GITHUB_OUTPUT"; echo "domain=$D" >> "$GITHUB_OUTPUT"
            echo "::notice::Site adresi: https://$D/"
          else
            echo "url=$OLD" >> "$GITHUB_OUTPUT"; echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"; echo "domain=" >> "$GITHUB_OUTPUT"
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

      - name: Yeni bölüm, sezon ve yapımları bul
        if: github.event_name != 'push'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/update-catalog.mjs

      - name: Eksik afiş ve Türkçe özetleri tamamla
        if: github.event_name != 'push'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/resolve-tmdb.mjs || true

      - name: Türkiye'deki platform bilgisini güncelle
        if: github.event_name != 'push'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/providers.mjs || true

      - name: Yenilikleri telefona bildir
        if: github.event_name != 'push'
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ steps.site.outputs.url }}
        run: node scripts/notify.mjs || true

      - name: Katalogu kaydet
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet src/data/catalog.json; then
            git config user.name "watchverse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/catalog.json
            git commit -m "Katalog güncellendi ($(date +%F))"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ]; then
            # GitHub, 60 gün hareketsiz kalan depolarda zamanlanmış görevi durdurur; bunu önlemek için
            git config user.name "watchverse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Haftalık kontrol: değişiklik yok"
            git push
          fi

      - name: Ara sunucuyu kur ya da güncelle
        id: worker
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs

      - name: Platform listelerini güncelle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/lists.mjs || true

      - name: Üyelik ve veritabanını kur ya da güncelle
        id: supa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ steps.site.outputs.url }}
          OLD_SITE_URL: ${{ steps.site.outputs.old }}
        run: node scripts/setup-supabase.mjs

      - name: Web uygulamasını hazırla
        env:
          CI: 1
          EXPO_PUBLIC_API_URL: ${{ steps.worker.outputs.api_url }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ steps.supa.outputs.supabase_url }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ steps.supa.outputs.supabase_key }}
          EXPO_PUBLIC_BUILD: ${{ github.sha }}
          EXPO_BASE_URL: ${{ steps.site.outputs.base }}
          EXPO_PUBLIC_CATALOG_URL: ${{ steps.site.outputs.url }}catalog.json
          DOMAIN: ${{ steps.site.outputs.domain }}
        run: |
          npx expo export --platform web --output-dir dist
          node scripts/pwa.mjs dist "$EXPO_BASE_URL"
          if [ -n "$DOMAIN" ]; then echo "$DOMAIN" > dist/CNAME; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
