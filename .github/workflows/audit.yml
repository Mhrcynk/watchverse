# Evren denetimi: katalogda eksik kalmış olabilecek yapımları listeler (kataloğa dokunmaz)
name: Evren denetimi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Denetle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/audit-universes.mjs 2>&1 | tee audit.txt; test ${PIPESTATUS[0]} -eq 0 || { echo "::error::$(tail -c 600 audit.txt | tr '\n' ' ')"; exit 1; }
      - name: Sonucu ayrı dala yaz
        run: |
          git config user.name "watchverse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan audit
          git rm -rf --cached . > /dev/null
          git add -f audit.json audit.txt
          git commit -m "Evren denetimi sonucu" > /dev/null
          git push -f origin audit
