# Yeni evrenleri kataloğa ekler (elle çalıştırılır)
name: Yeni evrenleri ekle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evrenleri ekle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/seed-universes.mjs
      - name: Platform ve fragman bilgisi
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/providers.mjs || true
      - name: Kaydet
        run: |
          git config user.name "watchverse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog.json scripts/sources.json
          git diff --cached --quiet || git commit -m "Yeni evrenler eklendi"
          git push
