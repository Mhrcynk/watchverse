# Native bildirim teslimatı doğrulanana kadar yalnızca platform listeleri güncellenir.
name: Mobil platform listeleri

on:
  schedule:
    - cron: '47 5 * * *'   # her gün 08:47 (Türkiye saati): bildirim + platform listeleri
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Platform listelerini güncelle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/lists.mjs || true

      - name: Koleksiyonları güncelle
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/collections.mjs || true
